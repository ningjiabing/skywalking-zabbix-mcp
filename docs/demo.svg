<text x="349.5" y="21" fill="#8b949e" font-size="12" text-anchor="middle">skywalking-zabbix-mcp — demo (synthetic data)</text>
<text x="22.0" y="52" fill="#8b949e" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">skywalking-zabbix-mcp</text>
<text x="215.2" y="52" fill="#3fb950" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">20 tools</text>
<text x="290.8" y="52" fill="#8b949e" textLength="352.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">(16 SkyWalking + 2 Zabbix + 2 correlation)</text>
<text x="22.0" y="94" fill="#39c5cf" font-weight="600" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt;</text>
<text x="38.8" y="94" fill="#c9d1d9" font-weight="600" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">What is wrong with 192.0.2.11::payment-service?</text>
<text x="38.8" y="115" fill="#8b949e" textLength="520.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺ diagnose_service(service_name='192.0.2.11::payment-service')</text>
<text x="38.8" y="157" fill="#c9d1d9" font-weight="600" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Application</text>
<text x="139.6" y="157" fill="#8b949e" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">— SkyWalking</text>
<text x="22.0" y="178" fill="#c9d1d9" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    cpm           610</text>
<text x="22.0" y="199" fill="#c9d1d9" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    resp_time_ms  </text>
<text x="173.2" y="199" fill="#d29922" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1460</text>
<text x="22.0" y="220" fill="#c9d1d9" textLength="184.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    sla           8740</text>
<text x="22.0" y="241" fill="#c9d1d9" textLength="655.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    alarm         Response time of service payment-service is more than 1000ms</text>
<text x="38.8" y="283" fill="#c9d1d9" font-weight="600" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Machine</text>
<text x="106.0" y="283" fill="#8b949e" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">— Zabbix host app-01 (192.0.2.11)</text>
<text x="22.0" y="304" fill="#c9d1d9" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    cpu util      </text>
<text x="173.2" y="304" fill="#d29922" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">94.6%</text>
<text x="22.0" y="325" fill="#c9d1d9" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    disk await    </text>
<text x="173.2" y="325" fill="#d29922" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">182.4 ms</text>
<text x="22.0" y="346" fill="#c9d1d9" textLength="420.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    problem       Disk I/O is overloaded on app-01</text>
<text x="22.0" y="388" fill="#39c5cf" font-weight="600" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt;</text>
<text x="38.8" y="388" fill="#c9d1d9" font-weight="600" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Which side failed first?</text>
<text x="38.8" y="409" fill="#8b949e" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⏺ correlate_incident(start='-1h', end='now')</text>
<text x="38.8" y="451" fill="#3fb950" font-weight="600" textLength="512.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">machine failed first (infra alarm precedes application alarm)</text>
<text x="38.8" y="472" fill="#8b949e" textLength="470.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Zabbix problem opened 2 min before the SkyWalking alarm.</text>
